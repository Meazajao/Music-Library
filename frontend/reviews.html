<h2>Skapa review</h2>

<form id="reviewForm">
  <label>Titel:</label><br>
  <input type="text" id="title" required><br><br>

  <label>Content:</label><br>
  <textarea id="content" required></textarea><br><br>

  <label>Rating (1-5):</label><br>
  <input type="number" id="rating" min="1" max="5" required><br><br>

  <button type="submit">Skapa review</button>
</form>

<p id="message"></p>

<h2>Alla reviews</h2>
<button id="loadReviews">Ladda reviews</button>

<ul id="reviewList"></ul>
